<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大模型 RAG 检索增强生成 · 入门基础架构介绍</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <!-- 星空背景 -->
    <div class="stars-bg" id="starsBg"></div>
    <div class="nebula-bg">
        <div class="nebula-orb nebula-1"></div>
        <div class="nebula-orb nebula-2"></div>
        <div class="nebula-orb nebula-3"></div>
    </div>

    <!-- 钢笔拖尾 Canvas -->
    <canvas id="pen-trail-canvas"></canvas>

    <!-- Slide 容器 -->
    <div id="slide-container"></div>

    <!-- 导航按钮 -->
    <button class="nav-btn prev-btn" onclick="prevSlide()">‹</button>
    <button class="nav-btn next-btn" onclick="nextSlide()">›</button>

    <!-- 进度条 -->
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- 页码指示器 -->
    <div class="page-indicator" id="pageIndicator">1 / 44</div>

    <!-- 键盘提示 -->
    <div class="keyboard-hint">
        <span>← → 翻页</span>
        <span>F 全屏</span>
        <span>M 菜单</span>
        <span>T 笔迹</span>
    </div>

    <!-- 侧边栏菜单 -->
    <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
    <div class="sidebar-menu" id="sidebarMenu">
        <div class="menu-header">
            <span class="menu-title">📑 课程目录</span>
            <button class="menu-close" onclick="closeMenu()">✕</button>
        </div>
        <div class="menu-items" id="menuItems"></div>
    </div>
    <button class="menu-trigger" onclick="toggleMenu()">☰</button>

    <script src="js/main.js"></script>
    <script src="js/interactive.js"></script>
</body>
</html>
